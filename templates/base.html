<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Career Platform{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/site.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="/">{{ profile.headline }}</a>
        <nav class="site-nav">
          <a href="/about">About</a>
          <a href="/experience">Experience</a>
          <a href="/projects">Projects</a>
          <a href="/resume">Resume</a>
          <a href="/contact">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <p>© 2026 {{ profile.headline }}</p>
        <div class="footer-links">
          <a href="{{ profile.contact_links.github }}">GitHub</a>
          <a href="{{ profile.contact_links.linkedin }}">LinkedIn</a>
          <a href="mailto:{{ profile.contact_links.email }}">Email</a>
        </div>
      </div>
    </footer>
  </body>
</html>
