{% extends "base.html" %}

{% block title %}About{% endblock %}

{% block content %}
<section class="section container narrow prose">
  <h1>About</h1>
  {% if profile.about %}
    {% for paragraph in profile.about.split('\n\n') %}
    <p>{{ paragraph }}</p>
    {% endfor %}
  {% else %}
    <p>{{ profile.summary }}</p>
  {% endif %}
  <div class="cta-row">
    <a class="button primary" href="/contact">Get in touch</a>
    <a class="button secondary" href="/experience">See my experience</a>
  </div>
</section>
{% endblock %}
