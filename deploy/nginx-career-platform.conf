# Install: sudo cp deploy/nginx-career-platform.conf /etc/nginx/sites-available/career-platform
#          sudo ln -s /etc/nginx/sites-available/career-platform /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Cloudflare proxies every request and connects on 443 (SSL mode Full (strict)),
# so there is no port 80 server. The security group only lets Cloudflare in.
server {
    listen 443 ssl http2;
    server_name tristaninfo.me aws.tristaninfo.me;

    # Cloudflare origin certificate, valid only behind Cloudflare.
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    # Log the visitor's address, not Cloudflare's, as the privacy page says.
    # Ranges from https://www.cloudflare.com/ips-v4 on 2026-11-07; keep them in
    # step with the career-web security group.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
