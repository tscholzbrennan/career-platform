# Install: sudo cp deploy/nginx-career-platform.conf /etc/nginx/sites-available/career-platform
#          sudo ln -s /etc/nginx/sites-available/career-platform /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# tristaninfo.me and aws.tristaninfo.me are DNS only (course instructions), so visitors connect
# straight to this server. TLS is a Let's Encrypt certificate from certbot
# (webroot), renewed by certbot.timer; port 80 only serves the ACME challenge
# and redirects everything else to HTTPS.
server {
    listen 80 default_server;
    server_name aws.tristaninfo.me tristaninfo.me;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    server_name aws.tristaninfo.me tristaninfo.me;

    ssl_certificate     /etc/letsencrypt/live/aws.tristaninfo.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aws.tristaninfo.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # If the root domain is later proxied through Cloudflare, log the visitor's
    # address, not Cloudflare's. Only Cloudflare's ranges are trusted, so a
    # direct visitor can't spoof the header. Ranges from
    # https://www.cloudflare.com/ips-v4 on 2026-11-07.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
